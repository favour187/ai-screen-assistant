name: Android — Build APK/AAB

on:
  push:
    branches: [main, master]
    paths: ["android/**", ".github/workflows/android.yml", "shared/**"]
  pull_request:
    branches: [main, master]
    paths: ["android/**", "shared/**"]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android (debug + signed release)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Node (for shared protocol typecheck)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Make gradlew executable
        run: chmod +x ./gradlew || echo "no wrapper — will use gradle action"

      - name: Validate protocol contract
        run: |
          if [ -d ../shared ]; then
            npm --prefix ../shared install --no-audit --no-fund || true
            npx --prefix ../shared tsc --noEmit || echo "shared typecheck failed"
          fi

      # ---- Signing setup (only if secrets are configured) ----
      # Secrets must be set in repo Settings → Secrets → Actions:
      #   ANDROID_KEYSTORE_BASE64  — base64 of your upload keystore (e.g. `base64 -w 0 my-release.jks`)
      #   ANDROID_KEYSTORE_PASSWORD — keystore password
      #   ANDROID_KEY_ALIAS — key alias
      #   ANDROID_KEY_PASSWORD — key password
      # Never commit keystore or passwords to git — they live only in GitHub Secrets and the ephemeral runner.
      - name: Decode keystore (signed release only)
        if: always()
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "No ANDROID_KEYSTORE_BASE64 — skipping signed release"; exit 0; fi
          echo "$KEYSTORE_B64" | base64 --decode > app/release.keystore
          echo "Keystore decoded to app/release.keystore (ephemeral, not committed)"
          ls -lh app/release.keystore

      - name: Create signing properties
        if: always()
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then echo "No keystore password — skipping"; exit 0; fi
          cat > app/signing.properties <<EOF
          storeFile=release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          echo "signing.properties created (ephemeral, .gitignored)"
          # Verify file exists but do not log secrets
          ls -l app/signing.properties

      - name: Lint
        run: |
          if [ -f ./gradlew ] && ! grep -q "stub" ./gradlew; then ./gradlew lintDebug --stacktrace; elif command -v gradle >/dev/null 2>&1; then gradle lintDebug --stacktrace; else echo "Skip lint — gradle not available"; fi

      - name: Assemble Debug APK
        run: |
          if [ -f ./gradlew ] && ! grep -q "stub" ./gradlew; then ./gradlew :app:assembleDebug --stacktrace; elif command -v gradle >/dev/null 2>&1; then gradle :app:assembleDebug --stacktrace; else echo "Skip debug — gradle not available"; fi

      - name: Assemble Signed Release APK
        if: always()
        env:
          HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          # Also expose as gradle properties for builds that read from -P
          ORG_GRADLE_PROJECT_storeFile: release.keystore
          ORG_GRADLE_PROJECT_storePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_keyAlias: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$HAS_KEYSTORE" ]; then echo "No keystore secret — skipping signed APK"; exit 0; fi
          if [ -f ./gradlew ] && ! grep -q "stub" ./gradlew; then
            ./gradlew :app:assembleRelease --stacktrace
            ls -lh app/build/outputs/apk/release/
          elif command -v gradle >/dev/null 2>&1; then gradle :app:assembleRelease --stacktrace; else echo "Skip release — no wrapper"; fi

      - name: Assemble Release Bundle (AAB) — for Play Store
        if: always()
        env:
          HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$HAS_KEYSTORE" ]; then echo "No keystore — skip bundle"; exit 0; fi
          if [ -f ./gradlew ] && ! grep -q "stub" ./gradlew; then ./gradlew :app:bundleRelease --stacktrace; ls -lh app/build/outputs/bundle/release/ || true; elif command -v gradle >/dev/null 2>&1; then gradle :app:bundleRelease --stacktrace; ls -lh app/build/outputs/bundle/release/ || true; else echo "skip bundle"; fi

      - name: Clean up signing material (never keep on runner longer than needed)
        if: always()
        run: |
          rm -f app/release.keystore app/signing.properties || true
          echo "Signing material removed"

      - name: Upload Debug APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Signed Release APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          # Only APK/AAB — no logs or metadata
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
          retention-days: 30
